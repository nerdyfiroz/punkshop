<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PunkShop – Stream & Download Movies and TV Shows</title>
    <meta
      name="description"
      content="Fast, dynamic entertainment portal to watch and download HD movies, trending TV series, and anime. Highly SEO-optimized and AdSense ready."
    />
    <meta name="keywords" content="PunkShop, watch movies online, download movies 1080p, stream TV series, free HD cinema, anime streaming, 4K download, safe download links" />
    <meta name="author" content="PunkShop Media" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- OpenGraph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PunkShop – Stream & Download Movies and TV Shows" />
    <meta
      property="og:description"
      content="Fast, dynamic entertainment portal to watch and download HD movies, trending TV series, and anime. Highly SEO-optimized and AdSense ready."
    />
    <meta property="og:site_name" content="PunkShop" />
    <meta property="og:url" content="https://punkshop.net" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PunkShop – Stream & Download Movies and TV Shows" />
    <meta
      name="twitter:description"
      content="Fast, dynamic entertainment portal to watch and download HD movies, trending TV series, and anime. Highly SEO-optimized and AdSense ready."
    />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80" />

    <!-- Google AdSense Ready Meta Tags & Fast DNS Prefetches -->
    <meta name="google-adsense-account" content="ca-pub-0000000000000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Schema.org WebSite Structured Data (SEO) -->
    <script type="application/ld+json" id="website-schema">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PunkShop",
      "url": "https://punkshop.net",
      "description": "Stream & download full HD movies and TV series online with ultra-fast servers and multi-resolution downloads.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://punkshop.net/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
